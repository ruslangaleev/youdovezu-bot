services:
  youdovezu.server:
    image: youdovezu-server
    build:
      context: .
      dockerfile: Youdovezu.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      - Database__ConnectionString=Host=postgres;Port=5432;Database=youdovezu;Username=youdovezu;Password=youdovezu_password
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads
    user: root
    command: sh -c "mkdir -p /app/uploads/driver-documents && chmod -R 777 /app/uploads && dotnet Youdovezu.Api.dll"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/bot/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - youdovezu-network

  youdovezu.frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://youdovezu.server:8080
        - REACT_APP_WEBAPP_URL=http://localhost:3000
        - REACT_APP_TEST_MODE=false
        - NODE_ENV=production
    image: youdovezu-frontend
    ports:
      - "3000:80"
    depends_on:
      youdovezu.server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - youdovezu-network      

  postgres:
    image: postgres:15-alpine
    container_name: youdovezu-postgres
    environment:
      - POSTGRES_DB=youdovezu
      - POSTGRES_USER=youdovezu
      - POSTGRES_PASSWORD=youdovezu_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youdovezu -d youdovezu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - youdovezu-network

volumes:
  postgres_data:
  uploads_data:
  certbot-www:
  certbot-certs:

networks:
  youdovezu-network:
    driver: bridge
